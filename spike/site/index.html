<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kvestuj spike</title>
<style>
  :root { --bg:#12141a; --card:#1c1f28; --line:#2e3340; --text:#e9ecf2; --mute:#9aa3b5; --accent:#5b8cff; --pass:#2ecc71; --fail:#ff5c5c; --run:#f5b942; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px 16px 96px; max-width:640px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:17px; margin:0; }
  .dev { color:var(--mute); font-size:13px; word-break:break-word; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:0 0 14px; }
  .head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  label.f { display:block; font-size:14px; color:var(--mute); margin:8px 0 4px; }
  input[type=text], input[type=password], textarea { width:100%; min-height:48px; padding:10px 12px; font:16px/1.3 inherit; font-family:inherit; color:var(--text); background:#0e1016; border:1px solid var(--line); border-radius:10px; }
  .btn { display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; margin:8px 0 0; padding:10px 14px; font:600 16px/1.2 inherit; font-family:inherit; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; text-align:center; -webkit-appearance:none; appearance:none; }
  .btn.alt { background:#2c3342; }
  .btn:disabled { opacity:.45; }
  .btn input[type=file] { display:none; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .chip { font-size:13px; font-weight:700; padding:3px 10px; border-radius:99px; background:#2c3342; color:var(--mute); white-space:nowrap; }
  .chip.RUNNING { background:var(--run); color:#201600; }
  .chip.PASS { background:var(--pass); color:#032410; }
  .chip.FAIL { background:var(--fail); color:#2a0000; }
  .log { margin:10px 0 0; padding:10px; background:#0e1016; border:1px solid var(--line); border-radius:10px; font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; word-break:break-word; max-height:260px; overflow:auto; min-height:20px; color:#cfd6e6; }
  .meta { font-size:14px; color:var(--mute); margin:8px 0 0; word-break:break-word; }
  progress { width:100%; height:14px; margin-top:10px; }
  video, img.media { width:100%; max-height:60vh; margin-top:10px; border-radius:10px; background:#000; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:rgba(18,20,26,.96); border-top:1px solid var(--line); }
  #bar .inner { max-width:640px; margin:auto; }
  #bar .btn { margin:0; }
  #fallback { display:none; margin-top:8px; height:140px; }
</style>
</head>
<body>
<h1>Kvestuj platform spike</h1>
<p class="dev" id="device"></p>

<section class="card">
  <label class="f" for="api">Web app URL</label>
  <input type="text" id="api" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec">
  <label class="f" for="key">API key</label>
  <input type="text" id="key" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="AIza...">
</section>

<section class="card" id="s1">
  <div class="head"><h2>Step 1 · Ping</h2><span class="chip" id="c1">—</span></div>
  <button class="btn" id="ping">Ping</button>
  <div class="log" id="l1"></div>
</section>

<section class="card" id="s2">
  <div class="head"><h2>Step 2 · Upload</h2><span class="chip" id="c2">—</span></div>
  <div class="row">
    <label class="btn alt">Record video<input type="file" id="rec" accept="video/*" capture="environment"></label>
    <label class="btn alt">Choose from library<input type="file" id="lib" accept="video/*,image/*"></label>
  </div>
  <p class="meta" id="fileinfo">No file chosen.</p>
  <button class="btn" id="upload">Upload</button>
  <progress id="prog" value="0" max="100"></progress>
  <div class="log" id="l2"></div>
</section>

<section class="card" id="s3">
  <div class="head"><h2>Step 3 · Share + play</h2><span class="chip" id="c3">—</span></div>
  <button class="btn" id="share">Share + play</button>
  <div id="mediabox"></div>
  <button class="btn alt" id="seek">Seek to middle</button>
  <div class="log" id="l3"></div>
</section>

<section class="card" id="s4">
  <div class="head"><h2>Step 4 · Shrink</h2><span class="chip" id="c4">—</span></div>
  <div class="log" id="feat" style="margin-top:0"></div>
  <label class="btn alt">Pick a 60 s video<input type="file" id="pick" accept="video/*"></label>
  <div class="log" id="meta4">No video picked.</div>
  <button class="btn" id="shrink">Shrink to 720p</button>
  <progress id="prog4" value="0" max="100"></progress>
  <img class="media" id="still" alt="" hidden>
  <button class="btn alt" id="upsmall">Upload the small one</button>
  <div class="log" id="l4"></div>
</section>

<div id="bar"><div class="inner">
  <button class="btn" id="copy">Copy report</button>
  <textarea id="fallback" readonly></textarea>
</div></div>

<script type="module" src="./spike.js?v=3"></script>
</body>
</html>
